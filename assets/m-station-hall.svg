<style>@font-face{font-family:'CityDisplay';font-weight:800;font-display:swap;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'CityArabic';font-weight:700;font-display:swap;src:url(data:font/woff2;base64,) format('woff2')}
