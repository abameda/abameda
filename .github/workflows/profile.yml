name: Refresh profile

# Redraws the profile README and its SVGs with live GitHub data once a day.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "profile.json"]

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch live GitHub data
        run: node scripts/fetch-data.mjs "${{ github.repository_owner }}" > data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all three worlds
        run: node scripts/build-all.mjs data.json profile.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets worlds data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile with live data"
            git push
          fi
